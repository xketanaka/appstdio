services:
  db:
    image: postgres:18
    volumes:
      - "./docker/volumes/postgres:/var/lib/postgresql"
      # ロール定義。ボリュームが空の初回起動時にのみ実行される
      - "./docker/files/db/initdb:/docker-entrypoint-initdb.d"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=ja-JP --locale=C.UTF-8"
      TZ: 'Asia/Tokyo'
      PGTZ: 'Asia/Tokyo'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build:
      context: ./docker/
    privileged: true
    ports:
      - "${APP_LISTEN_PORT:-6000}:3000"
    volumes:
      - ".:/opt/app-root/appstdio"
      - "./docker/volumes/bundle:/usr/local/bundle"
      - "node_modules:/opt/app-root/appstdio/node_modules"
    working_dir: /opt/app-root/appstdio
    command: sh -c "bundle install; bin/rails ${COMMAND:-server}"
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOME: ''
      LANGUAGE: "ja_JP:ja"
      LC_ALL: "ja_JP.UTF-8"
      BINDING: "0.0.0.0"
      # Prism は mmap でソースを読み、vboxsf ではホストで書き換えても古い内容が残る
      RUBYOPT: "-W:deprecated --parser=parse.y"
      DB_HOST: "db"
      DB_PORT: "5432"
      # Vite の開発サーバ。Rails がアセットの要求をここへ中継する
      VITE_RUBY_HOST: "vite"
      RAILS_DEVELOPMENT_HOSTS: ${RAILS_DEVELOPMENT_HOSTS}
      DB_USER: "appstdio_app"
      DB_PASSWORD: "app_password"
      # bin/rails-as-owner が使う
      DB_OWNER_USER: "appstdio_owner"
      DB_OWNER_PASSWORD: "owner_password"

  ops:
    build:
      context: ./docker/
    privileged: true
    ports:
      - "${OPS_LISTEN_PORT:-6001}:3000"
    volumes:
      - ".:/opt/app-root/appstdio"
      - "./docker/volumes/bundle:/usr/local/bundle"
      - "node_modules:/opt/app-root/appstdio/node_modules"
    working_dir: /opt/app-root/appstdio
    command: sh -c "bundle install; bin/rails ${COMMAND:-server}"
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOME: ''
      LANGUAGE: "ja_JP:ja"
      LC_ALL: "ja_JP.UTF-8"
      BINDING: "0.0.0.0"
      # Prism は mmap でソースを読み、vboxsf ではホストで書き換えても古い内容が残る
      RUBYOPT: "-W:deprecated --parser=parse.y"
      DB_HOST: "db"
      DB_PORT: "5432"
      # Vite の開発サーバ。Rails がアセットの要求をここへ中継する
      VITE_RUBY_HOST: "vite"
      OPS_CONSOLE: "1"
      RAILS_DEVELOPMENT_HOSTS: ${RAILS_DEVELOPMENT_HOSTS}
      DB_USER: "appstdio_owner"
      DB_PASSWORD: "owner_password"
      # bin/rails-as-owner が使う
      DB_OWNER_USER: "appstdio_owner"
      DB_OWNER_PASSWORD: "owner_password"

  vite:
    build:
      context: ./docker/
    ports:
      - "${VITE_LISTEN_PORT:-3036}:3036"
    volumes:
      - ".:/opt/app-root/appstdio"
      - "./docker/volumes/bundle:/usr/local/bundle"
      - "node_modules:/opt/app-root/appstdio/node_modules"
    working_dir: /opt/app-root/appstdio
    command: sh -c "bundle install; npm install; bin/vite dev"
    restart: always
    environment:
      HOME: ''
      LANGUAGE: "ja_JP:ja"
      LC_ALL: "ja_JP.UTF-8"
      # Prism は mmap でソースを読み、vboxsf ではホストで書き換えても古い内容が残る
      RUBYOPT: "-W:deprecated --parser=parse.y"
      VITE_RUBY_HOST: "0.0.0.0"
      VITE_LISTEN_PORT: ${VITE_LISTEN_PORT:-3036}
      RAILS_DEVELOPMENT_HOSTS: ${RAILS_DEVELOPMENT_HOSTS}

# npm は node_modules にシンボリックリンクを作るが、vboxsf では作れない。コード側のボリュームに重ねて置く
volumes:
  node_modules:

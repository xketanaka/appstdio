services:
  db:
    image: postgres:18
    volumes:
      - "./docker/volumes/postgres:/var/lib/postgresql"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
      # DB は UTF8、照合順序は ICU の ja-JP を使う
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=ja-JP --locale=C.UTF-8"
      TZ: 'Asia/Tokyo'
      PGTZ: 'Asia/Tokyo'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build:
      context: ./docker/
    privileged: true
    volumes:
      - ".:/opt/app-root/appstdio"
      - "./docker/volumes/bundle:/usr/local/bundle"
    working_dir: /opt/app-root/appstdio
    command: sh -c "bundle install; bin/rails ${COMMAND:-server}"
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOME: ''
      LANGUAGE: "ja_JP:ja"
      LC_ALL: "ja_JP.UTF-8"
      BINDING: "0.0.0.0"
      RUBYOPT: "-W:deprecated"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_PASSWORD: "password"
